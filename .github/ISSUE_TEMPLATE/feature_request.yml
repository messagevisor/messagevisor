name: Feature request
description: Propose an improvement to Messagevisor
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What authoring, localization, runtime, or review problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: portability
    attributes:
      label: Cross-platform considerations
      description: Note any JavaScript, Java, browser, mobile, TMS, ICU, or CLDR implications.
