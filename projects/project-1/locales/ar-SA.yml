description: Arabic (Saudi Arabia)

inheritFormatsFrom: en
inheritTranslationsFrom: en

formats:
  number:
    money:
      style: currency
      currency: SAR
    moneySymbol:
      style: currency
      currency: SAR
      currencyDisplay: symbol
    moneyCode:
      style: currency
      currency: SAR
      currencyDisplay: code
    moneyNarrow:
      style: currency
      currency: SAR
      currencyDisplay: narrowSymbol
    moneyName:
      style: currency
      currency: SAR
      currencyDisplay: name
    moneyAccounting:
      style: currency
      currency: SAR
      currencySign: accounting

# These examples evaluate the format reference suite for ar-SA.
# ar-SA keeps the same preset names as en, but overrides the default money
# presets to SAR so country-specific currency output is visible by default.
# Keep rawMessage on one line: folded YAML can change ICU parsing.

examples:
  - description: "Basics / simple text"
    rawMessage: "Hello, world!"

  - description: "Basics / interpolation"
    rawMessage: "Hello, {name}!"
    values:
      name: John

  - description: "Number / decimal max 2"
    rawMessage: "Decimal max 2: {value, number, decimal}"
    values:
      value: 1234.567

  - description: "Number / fixed 2 decimals"
    rawMessage: "Fixed 2 decimals: {value, number, decimalFixed}"
    values:
      value: 1234.5

  - description: "Number / padded integer"
