  - description: Number / decimal sub-unit
    rawMessage: "{value, number, decimal}"
    values:
      value: 0.01234
    expectedByRuntime:
      swift: "0.01"
  - description: Number / minimum 2 fraction digits integer
    rawMessage: "{value, number, fractionMin2}"
    values:
      value: 12
    expectedByRuntime:
      swift: "12.00"
  - description: Number / minimum 2 fraction digits fraction
    rawMessage: "{value, number, fractionMin2}"
    values:
      value: 12.3
    expectedByRuntime:
      swift: "12.30"
  - description: Number / maximum 4 fraction digits
