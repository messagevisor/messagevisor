description: Bengali

inheritFormatsFrom: en
inheritTranslationsFrom: en

formats:
  number:
    money:
      style: currency
      currency: BDT
    moneySymbol:
      style: currency
      currency: BDT
      currencyDisplay: symbol
    moneyCode:
      style: currency
      currency: BDT
      currencyDisplay: code
    moneyNarrow:
      style: currency
      currency: BDT
      currencyDisplay: narrowSymbol
    moneyName:
      style: currency
      currency: BDT
      currencyDisplay: name
    moneyAccounting:
      style: currency
      currency: BDT
      currencySign: accounting

# These examples evaluate the format reference suite for bn.
# bn keeps the same preset names as en, but overrides the default money
# presets to BDT so Bengali currency output is visible by default.
# Keep rawMessage on one line: folded YAML can change ICU parsing.

examples:
  - description: "Basics / simple text"
    rawMessage: "Hello, world!"

  - description: "Basics / interpolation"
    rawMessage: "Hello, {name}!"
    values:
      name: John

  - description: "Number / decimal max 2"
    rawMessage: "Decimal max 2: {value, number, decimal}"
    values:
      value: 1234.567

    expectedByRuntime:
      swift: "Decimal max 2: 1,234.57"
  - description: "Number / fixed 2 decimals"
    rawMessage: "Fixed 2 decimals: {value, number, decimalFixed}"
    values:
      value: 1234.5

    expectedByRuntime:
      swift: "Fixed 2 decimals: 1,234.50"
  - description: "Number / padded integer"
    rawMessage: "Padded integer: {value, number, integerPadded}"
    values:
      value: 12

    expectedByRuntime:
      swift: "Padded integer: 0,012"
  - description: "Number / 3 significant digits"
