  # Granular format conformance examples
  - description: Number / decimal negative
    rawMessage: "{value, number, decimal}"
    values:
      value: -1234.567
    expectedByRuntime:
      swift: "-1,234.57"
  - description: Number / decimal zero
    rawMessage: "{value, number, decimal}"
