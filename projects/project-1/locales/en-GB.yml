    rawMessage: "{v, number}"
    values:
      v: 1234567.891

  - description: "Number / plain — negative fractional."
    rawMessage: "{v, number}"
    values:
      v: -987654.321

  - description: "Number / plain — zero."
    rawMessage: "{v, number}"
    values:
      v: 0

  - description: "Number / plain — single-digit positive integer."
    rawMessage: "{v, number}"
    values:
      v: 1

  - description: "Number / plain — large integer (grouping in en-GB)."
    rawMessage: "{v, number}"
    values:
      v: 4820193

  - description: "Number / plain — very small positive fraction (may display as 0 without extra digits)."
