description: English (United Kingdom)

inheritFormatsFrom: en
inheritTranslationsFrom: en

# Raw ICU examples use `resolveFormats("en-GB", …)`; presets come from `en.yml` via `inheritFormatsFrom`.
# One logical use case per example; `rawMessage` is a single placeholder except `plural` / `select`.
# Keep `rawMessage` on one line: multiline folded YAML can break ICU parsing and surface as date format errors.
# ISO 8601 strings in `values` are coerced to `Date` when evaluating via the CLI (mix of fractional-second
# and whole-second forms is intentional).
#
# Order: numbers (plain → decimal → …) → ICU plural/select → dates → times → time zones → composition (multi-placeholder).

examples:
