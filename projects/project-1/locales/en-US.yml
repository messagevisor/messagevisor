    rawMessage: "{v, number}"
    values:
      v: 1234567.891

  - description: "Number / plain — negative fractional."
    rawMessage: "{v, number}"
    values:
      v: -987654.321

  - description: "Number / plain — zero."
    rawMessage: "{v, number}"
    values:
      v: 0

  - description: "Number / plain — single-digit positive integer."
    rawMessage: "{v, number}"
    values:
