description: Dutch (The Netherlands)

inheritFormatsFrom: nl
inheritTranslationsFrom: nl

# These examples evaluate the inherited format reference suite for nl-NL.
# nl inherits the broad format presets from en and overrides the default money
# presets to EUR, so this locale shows the same copy/paste patterns with Dutch
# punctuation, dates, time, and currency output.
# Keep rawMessage on one line: folded YAML can change ICU parsing.

