    segments: plan-pro
    translations:
      en: Welcome back, {name}. Your Pro workspace is ready.
      nl: Welkom terug, {name}. Je Pro-werkruimte staat klaar.
  - key: dutch-web
    segments:
      and:
        - dutch-account
        - platform-web
    translations:
