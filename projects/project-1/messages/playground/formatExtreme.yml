      plain: 1234567.891
      fixed: 12
      sig: 12345.678
      plus: 5
      compact: 12500
      distance: 42
      money: 99.5
      yen: 1999.99
      rate: 0.0575
      when: "2026-05-12T08:30:45.678Z"

