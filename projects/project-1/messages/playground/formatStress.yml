description: Mixed number, currency, date, time, and per-call override formatting stress message

translations:
  en: "Receipt {amount, number, moneyAccounting}; ISO {amount, number, moneyCode}; rate {rate, number, percent}; compact {visits, number, compactShort}; distance {distance, number, unitKilometerShort}; placed {placedAt, date, weekday} at {placedAt, time, seconds}; local {placedAt, time, zoneShortGeneric}."
