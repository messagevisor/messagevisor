description: Re-engagement window using nested date, status, and platform conditions

conditions:
  and:
    - or:
        - attribute: signupDate
          operator: before
          value: 2026-01-01T00:00:00Z
        - attribute: signupDate
          operator: after
          value: 2026-03-01T00:00:00Z
    - not:
        - or:
            - attribute: permissions
              operator: includes
              value: suspended
            - attribute: permissions
              operator: includes
              value: deleted
    - or:
        - attribute: platform
          operator: equals
          value: web
        - and:
            - attribute: platform
              operator: equals
              value: ios
            - attribute: permissions
              operator: includes
              value: push-enabled
