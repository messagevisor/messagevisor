# JavaScript reference output: Node 24 / Intl. One raw ICU format per assertion.
locale: "fr-FR"
assertions:
  - description: "Currency / default money"
    rawMessage: "{amount, number, money}"
    values:
      amount: 1234.5
    expectedTranslation: "1\u202F234,50\u00A0€"
  - description: "Currency / symbol display"
    rawMessage: "{amount, number, moneySymbol}"
    values:
      amount: 1234.5
    expectedTranslation: "1\u202F234,50\u00A0€"
  - description: "Currency / code display"
    rawMessage: "{amount, number, moneyCode}"
    values:
      amount: 1234.5
    expectedTranslation: "1\u202F234,50\u00A0EUR"
  - description: "Currency / narrow symbol display"
    rawMessage: "{amount, number, moneyNarrow}"
    values:
      amount: 1234.5
    expectedTranslation: "1\u202F234,50\u00A0€"
  - description: "Currency / name display"
    rawMessage: "{amount, number, moneyName}"
    values:
      amount: 1234.5
    expectedTranslation: "1\u202F234,50 euros"
  - description: "Currency / accounting sign"
    rawMessage: "{amount, number, moneyAccounting}"
    values:
      amount: -1234.5
    expectedTranslation: "(1\u202F234,50\u00A0€)"
  - description: "Currency / runtime currency"
    rawMessage: "{amount, number, moneyRuntimeCurrency}"
    values:
      amount: 1234.5
    currency: "EUR"
    expectedTranslation: "1\u202F234,50\u00A0EUR"
  - description: "Currency / GBP"
    rawMessage: "{amount, number, moneyGbp}"
    values:
      amount: 1234.5
    expectedTranslation: "1\u202F234,50\u00A0£GB"
  - description: "Currency / JPY"
    rawMessage: "{amount, number, moneyJpy}"
    values:
      amount: 1234.5
    expectedTranslation: "1\u202F235\u00A0JPY"
    expectedByRuntime:
      python: "1 234 JPY"
  - description: "Currency / EUR"
    rawMessage: "{amount, number, moneyEur}"
    values:
      amount: 1234.5
    expectedTranslation: "1\u202F234,50\u00A0€"
  - description: "Unit and percent / percent"
    rawMessage: "{value, number, percent}"
    values:
      value: 0.125
    expectedTranslation: "12,5\u00A0%"
    expectedByRuntime:
      python: "12,5%"
  - description: "Unit and percent / percent fixed"
    rawMessage: "{value, number, percentFixed}"
    values:
      value: 0.125
    expectedTranslation: "12,50\u00A0%"
    expectedByRuntime:
      python: "12,50%"
  - description: "Unit and percent / kilometer short"
    rawMessage: "{value, number, unitKilometerShort}"
    values:
      value: 42
    expectedTranslation: "42\u202Fkm"
  - description: "Unit and percent / kilometer narrow"
    rawMessage: "{value, number, unitKilometerNarrow}"
    values:
      value: 42
    expectedTranslation: "42km"
    expectedByRuntime:
      swift: "42\u202Fkm"
  - description: "Unit and percent / kilometer long"
    rawMessage: "{value, number, unitKilometerLong}"
    values:
      value: 42
    expectedTranslation: "42\u00A0kilomètres"
  - description: "Unit and percent / meter long"
    rawMessage: "{value, number, unitMeterLong}"
    values:
      value: 42
    expectedTranslation: "42\u00A0mètres"
  - description: "Currency / default zero"
    rawMessage: "{amount, number, money}"
    values:
      amount: 0
    expectedTranslation: "0,00\u00A0€"
  - description: "Currency / default negative"
    rawMessage: "{amount, number, money}"
    values:
      amount: -1234.5
    expectedTranslation: "-1\u202F234,50\u00A0€"
  - description: "Currency / accounting positive"
    rawMessage: "{amount, number, moneyAccounting}"
    values:
      amount: 1234.5
    expectedTranslation: "1\u202F234,50\u00A0€"
  - description: "Currency / runtime GBP"
    rawMessage: "{amount, number, moneyRuntimeCurrency}"
    values:
      amount: 1234.5
    currency: "GBP"
    expectedTranslation: "1\u202F234,50\u00A0GBP"
  - description: "Currency / JPY zero decimals"
    rawMessage: "{amount, number, moneyJpy}"
    values:
      amount: 1234.5
    expectedTranslation: "1\u202F235\u00A0JPY"
    expectedByRuntime:
      python: "1 234 JPY"
  - description: "Unit and percent / percent zero"
    rawMessage: "{value, number, percent}"
    values:
      value: 0
    expectedTranslation: "0\u00A0%"
    expectedByRuntime:
      python: "0%"
  - description: "Unit and percent / percent negative"
    rawMessage: "{value, number, percent}"
    values:
      value: -0.125
    expectedTranslation: "-12,5\u00A0%"
    expectedByRuntime:
      python: "-12,5%"
  - description: "Unit and percent / kilometer singular long"
    rawMessage: "{value, number, unitKilometerLong}"
    values:
      value: 1
    expectedTranslation: "1\u00A0kilomètre"
  - description: "Unit and percent / kilometer plural long"
    rawMessage: "{value, number, unitKilometerLong}"
    values:
      value: 2
    expectedTranslation: "2\u00A0kilomètres"
