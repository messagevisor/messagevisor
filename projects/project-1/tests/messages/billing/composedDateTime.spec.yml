message: billing.composedDateTime

assertions:
  - locale: en-US
    target: web
    timeZone: UTC
    values:
      prefix: Webinar
      suffix: sharp
      date: "2025-01-01T12:00:00Z"
    expectedTranslation: "Webinar: 01/01/2025 at 12:00 PM sharp"
  - locale: nl-NL
    target: web
    timeZone: Europe/Amsterdam
    values:
      prefix: Webinar
      suffix: precies
      date: "2025-01-01T12:00:00Z"
    expectedTranslation: "Webinar: 01-01-2025 om 13:00 precies"
