message: billing.currencyDisplay

assertions:
  - locale: en-US
    target: web
    values:
      amount: 12
    expectedTranslation: "Symbol: $12.00; code: USD 12.00; accounting: $12.00"
    expectedByRuntime:
      go: "Symbol: $12.00; code: USD12.00; accounting: $12.00"
  - locale: en-US
    target: web
    currency: EUR
    values:
      amount: -12
    expectedTranslation: "Symbol: -€12.00; code: -EUR 12.00; accounting: (€12.00)"
    expectedByRuntime:
      go: "Symbol: -€12.00; code: -EUR12.00; accounting: (€12.00)"
  - locale: nl-NL
    target: web
    values:
      amount: 12
    expectedTranslation: "Symbool: € 12,00; code: EUR 12,00; boekhouding: € 12,00"
    expectedByRuntime:
      go: "Symbool: 12,00 €; code: 12,00 EUR; boekhouding: 12,00 €"
  - locale: nl-NL
    target: web
    currency: USD
    values:
      amount: -12
    expectedTranslation: "Symbool: US$ -12,00; code: USD -12,00; boekhouding: (US$ 12,00)"
    expectedByRuntime:
      java: "Symbool: US$ -12,00; code: -USD 12,00; boekhouding: (US$ 12,00)"
      go: "Symbool: -12,00 US$; code: -12,00 USD; boekhouding: -12,00 US$"
