message: billing.timeZoneLong

assertions:
  - locale: en-US
    target: web
    timeZone: UTC
    values:
      date: "2025-01-01T12:00:00Z"
    expectedTranslation: "Local time: 12:00 PM"
    expectedByRuntime:
      go: "Local time: 12:00 pm"
      java: "Local time: 12:00 PM"
  - locale: en-US
    target: web
    timeZone: America/New_York
    values:
      date: "2025-01-01T12:00:00Z"
    expectedTranslation: "Local time: 7:00 AM"
    expectedByRuntime:
      go: "Local time: 7:00 am"
      java: "Local time: 7:00 AM"
  - locale: nl-NL
    target: web
    timeZone: Europe/Amsterdam
    values:
      date: "2025-01-01T12:00:00Z"
    expectedTranslation: "Lokale tijd: 13:00"
    expectedByRuntime:
      java: "Lokale tijd: 13:00"
