message: playground.icuStress

assertions:
  - description: en-US ICU stress female zero tasks offset exact one guest
    locale: en-US
    target: web
    values:
      name: Ada
      gender: female
      items: 0
      rank: 1
      guests: 1
      host: Ada
    expectedTranslation: "Ada said she is ready. No tasks. Rank: 1st. Guests: Ada is coming alone. Literal braces: {ok}."

