segment: reengagement-window

assertions:
  - description: "reengagement-window matches older iOS users with push enabled"
    segment: reengagement-window
    context:
      signupDate: 2025-12-01
      platform: ios
      permissions:
        - push-enabled
        - marketing
    expectedToMatch: true

  - description: "reengagement-window matches web users in the later window"
    segment: reengagement-window
    context:
      signupDate: 2026-04-10
      platform: web
      permissions:
        - marketing
    expectedToMatch: true

  - description: "reengagement-window rejects suspended users"
    segment: reengagement-window
    context:
      signupDate: 2025-12-01
      platform: ios
      permissions:
        - push-enabled
        - suspended
    expectedToMatch: false
