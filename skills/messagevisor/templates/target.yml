description: Web application

includeMessages:
  - auth*
  - dashboard*

# excludeMessages:
#   - dashboard.internal*

# Include/exclude resolved format presets by type and style name.
# includeFormats:
#   number: "*"
#   date: short*
# excludeFormats:
#   number: moneyCode

locales:
  - en
  - nl

# Compile-time context applied to all datafiles for this target.
# Use only for values that are always true for every user of this target.
context:
  platform: web

